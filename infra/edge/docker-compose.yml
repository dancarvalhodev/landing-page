services:
    caddy:
        image: caddy:2-alpine
        ports:
            - 80:80
            - 443:443
            - 443:443/udp
        environment:
            DOMAIN: ${DOMAIN:?informe DOMAIN}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - edge
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: "3"

volumes:
    caddy_data:
    caddy_config:

networks:
    edge:
        external: true

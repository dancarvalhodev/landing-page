; Ajustes do PHP-FPM do Ubuntu para rodar em contêiner, como faz a imagem oficial do PHP.
[global]
error_log = /proc/self/fd/2
; Em desenvolvimento o contêiner roda com o usuário do computador, que não grava em /run/php.
pid = /tmp/php-fpm.pid

[www]
; O Ubuntu escuta em um socket; o Caddy fala com o PHP pela rede, na porta 9000.
listen = 9000
; Sem isso o PHP-FPM apaga as variáveis de ambiente, e o app não enxerga APP_ENV e SITE_URL.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

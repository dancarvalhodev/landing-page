name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    php:
        name: Estilo, análise e testes
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: www
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none

            - name: Instalar dependências
              run: composer install --no-interaction --no-progress

            - name: Estilo de código (PHP-CS-Fixer)
              run: composer cs

            - name: Análise estática (PHPStan)
              run: composer stan

            - name: Testes (PHPUnit)
              run: composer test
